{% extends "base.html" %}

{% block content %}

<div class="auth-form">

<h2>
    Vendor Login
</h2>

<form method="POST">

    <!-- USERNAME -->

    <input type="text"
           name="username"
           placeholder="Username"
           required>

    <!-- PASSWORD -->

    <input type="password"
           name="password"
           placeholder="Password"
           required>

    <!-- BUTTON -->

    <button>
        Login
    </button>

</form>

</div>

{% endblock %}
