{% extends "base.html" %}

{% block content %}

<div class="auth-form">

<h2>
    Vendor Signup
</h2>

<form method="POST">

    <!-- USERNAME -->

    <input type="text"
           name="username"
           placeholder="Username"
           required>

    <!-- EMAIL -->

    <input type="email"
           name="email"
           placeholder="Email"
           required>

    <!-- PHONE -->

    <input type="text"
           name="phone"
           placeholder="Phone Number"
           required>

    <!-- SHOP NAME -->

    <input type="text"
           name="shop_name"
           placeholder="Shop Name"
           required>

    <!-- PASSWORD -->

    <input type="password"
           name="password"
           placeholder="Password"
           required>

    <!-- BUTTON -->

    <button>
        Create Account
    </button>

</form>

</div>

{% endblock %}
