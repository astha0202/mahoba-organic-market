{% extends "base.html" %}

{% block content %}

<div class="dashboard-form"
style="max-width:500px;margin:auto;">

<h2>
    Change Password
</h2>

<form method="POST"
      id="passwordForm">

    <!-- OLD PASSWORD -->

    <input type="password"
           name="old_password"
           placeholder="Old Password"
           required>

    <!-- NEW PASSWORD -->

    <div class="password-wrapper">

        <input type="password"
               name="new_password"
               id="newPassword"
               placeholder="New Password"
               required>

        <!-- REQUIREMENTS -->

        <div class="password-rules"
             id="passwordRules">

            <p id="lengthRule">
                ❌ Minimum 8 characters
            </p>

            <p id="upperRule">
                ❌ One uppercase letter
            </p>

            <p id="lowerRule">
                ❌ One lowercase letter
            </p>

            <p id="digitRule">
                ❌ One number
            </p>

            <p id="specialRule">
                ❌ One special character
            </p>

        </div>

    </div>

    <!-- CONFIRM PASSWORD -->

    <input type="password"
           id="confirmPassword"
           placeholder="Confirm Password"
           required>

    <!-- PASSWORD MATCH -->

    <p id="matchMessage">

    </p>

    <button>
        Update Password
    </button>

</form>

</div>

<!-- SCRIPT -->

<script>

/* =========================
   PASSWORD VALIDATION
========================= */

let password =
document.getElementById("newPassword");

let confirmPassword =
document.getElementById("confirmPassword");

password.addEventListener("input", validatePassword);

confirmPassword.addEventListener("input", checkPasswordMatch);

function validatePassword(){

    let value = password.value;

    // RULES

    let hasLength =
    value.length >= 8;

    let hasUpper =
    /[A-Z]/.test(value);

    let hasLower =
    /[a-z]/.test(value);

    let hasDigit =
    /[0-9]/.test(value);

    let hasSpecial =
    /[!@#$%^&*(),.?":{}|<>]/.test(value);

    updateRule("lengthRule", hasLength);
    updateRule("upperRule", hasUpper);
    updateRule("lowerRule", hasLower);
    updateRule("digitRule", hasDigit);
    updateRule("specialRule", hasSpecial);

    checkPasswordMatch();
}

/* =========================
   UPDATE RULE COLOR
========================= */

function updateRule(id, valid){

    let el =
    document.getElementById(id);

    if(valid){

        el.style.color = "#4caf50";

        el.innerHTML =
        "✅ " + el.innerHTML.substring(2);

    }else{

        el.style.color = "#ff4d4d";

        el.innerHTML =
        "❌ " + el.innerHTML.substring(2);
    }
}

/* =========================
   PASSWORD MATCH
========================= */

function checkPasswordMatch(){

    let msg =
    document.getElementById("matchMessage");

    if(confirmPassword.value === ""){

        msg.innerHTML = "";
        return;
    }

    if(password.value === confirmPassword.value){

        msg.innerHTML =
        "✅ Passwords Match";

        msg.style.color =
        "#4caf50";

    }else{

        msg.innerHTML =
        "❌ Passwords Do Not Match";

        msg.style.color =
        "#ff4d4d";
    }
}

</script>

{% endblock %}
