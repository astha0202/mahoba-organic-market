{% extends "base.html" %}

{% block content %}

<h2 class="shop-title"
    data-key="allshops">

    All Shops

</h2>

<div class="product-grid">

{% for s in shops %}

<div class="card">

    <!-- SHOP IMAGE -->

    <img src="{{ s.image }}"
         width="100%"
         height="180"

         style="
         object-fit:contain;
         border-radius:14px;
         background:white;
         padding:10px;">

    <!-- SHOP NAME -->

    <h3>

        {{ s.name }}

    </h3>

    <!-- STARS -->

    <div class="stars">

        ⭐ ⭐ ⭐ ⭐ ☆

    </div>

    <br>

    <!-- BUTTON -->

    <a href="/shop/{{ s.id }}">

        <button data-key="viewshop">

            View Shop

        </button>

    </a>

</div>

{% endfor %}

</div>

{% endblock %}
